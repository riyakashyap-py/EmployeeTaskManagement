<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Employee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f7fc;
        }

        .card{
            border:none;
            border-radius:15px;
        }

        .card-header{
            border-radius:15px 15px 0 0 !important;
        }

        .form-control{
            border-radius:10px;
            height:45px;
        }

        .btn{
            border-radius:10px;
            padding:10px 25px;
        }

        img{
            border-radius:10px;
            border:1px solid #ddd;
            margin-bottom:10px;
        }
    </style>

</head>
<body>

<div class="container mt-5 mb-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-lg">

                <div class="card-header bg-warning text-dark">

                    <h2>
                        ✏ Edit Employee
                    </h2>

                </div>

                <div class="card-body">

                    <form method="POST" enctype="multipart/form-data">

                        {% csrf_token %}

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Employee Name
                            </label>
                            {{ form.name }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Email
                            </label>
                            {{ form.email }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Phone
                            </label>
                            {{ form.phone }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Department
                            </label>
                            {{ form.department }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Designation
                            </label>
                            {{ form.designation }}
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">
                                Employee Photo
                            </label>

                            {% if employee.photo %}
                                <br>
                                <img src="{{ employee.photo.url }}"
                                     width="120"
                                     >
                                <br><br>
                            {% endif %}

                            {{ form.photo }}
                        </div>

                        <button type="submit"
                                class="btn btn-success">
                            💾 Update Employee
                        </button>

                        <a href="{% url 'employee_list' %}"
                           class="btn btn-secondary">
                            ⬅ Back
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
