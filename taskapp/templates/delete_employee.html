<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delete Employee</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background:#f4f6f9;
        }

        .card{
            margin-top:80px;
            border:none;
            border-radius:15px;
            box-shadow:0 10px 25px rgba(0,0,0,.15);
        }

        .card-header{
            background:#dc3545;
            color:white;
            font-size:28px;
            font-weight:bold;
        }

        .btn{
            border-radius:10px;
        }
    </style>

</head>
<body>

<div class="container">

    <div class="row justify-content-center">

        <div class="col-md-6">

            <div class="card">

                <div class="card-header">
                    🗑 Delete Employee
                </div>

                <div class="card-body text-center">

                    <h4 class="mb-4">
                        Are you sure you want to delete
                        <span class="text-danger">
                            {{ employee.name }}
                        </span> ?
                    </h4>

                    <form method="POST">

                        {% csrf_token %}

                        <button class="btn btn-danger btn-lg">
                            🗑 Yes, Delete
                        </button>

                        <a href="{% url 'employee_list' %}" class="btn btn-secondary btn-lg">
                            Cancel
                        </a>

                    </form>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
